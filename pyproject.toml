[project]
name = "photographer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pillow>=10.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dinov2 = ["torch>=2.0", "transformers>=4.30"]

[project.scripts]
photographer = "photographer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
