[project]
name = "milkshake-mafia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pillow>=10.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dinov2 = ["torch>=2.0", "torchvision>=0.15", "transformers>=4.30"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.6"]

[project.scripts]
photographer = "photographer.cli:main"
milkshake = "milkshake.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["photographer*", "milkshake*", "sommelier*", "service*"]
